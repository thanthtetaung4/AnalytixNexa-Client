# Included into every location rather than set once at server level.
#
# nginx inherits `add_header` from the enclosing block only when the current
# block declares none of its own. Both the asset and index locations set
# caching headers, which silently drops every security header set above them —
# so the headers have to be repeated wherever add_header is used at all. An
# include is how they get repeated without three copies to keep in step.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
