# Static hosting for the built single-page app.
#
# TLS, HTTP/2 and the /api and /otlp routes are the edge proxy's job; this
# server only hands out files. It is reached over the internal network, never
# directly from the internet.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind a proxy, so the useful client address is the one in the forwarded
    # header — the peer address is the proxy itself.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff2;

    # Vite fingerprints every asset filename, so a given URL's contents can
    # never change — cache for a year and skip the revalidation round trip.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The one file that must not be cached: it is what points at the current
    # fingerprinted bundle, and a stale copy pins users to the previous deploy.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: an unmatched path is a route the app resolves
    # itself, not a 404.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
